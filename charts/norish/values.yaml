## Global settings
nameOverride: ""
fullnameOverride: ""

## Image settings
image:
  repository: norishapp/norish
  tag: "v0.20.0-beta"
  pullPolicy: IfNotPresent

imagePullSecrets: []

## Deployment settings
replicaCount: 1
revisionHistoryLimit: 3

# Pod security settings
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

## Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

## Pod annotations
podAnnotations: {}

## Service settings
service:
  type: ClusterIP
  port: 3000
  annotations: {}

## Ingress settings
ingress:
  enabled: false
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: norish.domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - norish.domain.com
      # Optional: specify the name of an existing TLS secret
      # secretName: "existing-tls-secret"

## Persistence settings
persistence:
  enabled: true
  # Use an existing PVC instead of creating a new one
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

## Resource limits and requests
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Application health checks
probes:
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
    path: /api/v1/health
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
    # Deliberately NOT /api/v1/health: since v0.18.1 that endpoint returns 503 when the
    # database is unreachable, so a transient DB outage would restart the pod. The app
    # root confirms the process is alive without coupling liveness to the database.
    # Readiness still uses the health endpoint, which is what pulls the pod out of the
    # Service during a DB outage.
    path: /
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
    path: /api/v1/health

## Application configuration
config:
  # Application URL (required)
  # This should match your ingress hostname
  authUrl: "http://norish.domain.com"

  # Extra environment variables
  # Example:
  # extraEnv:
  #   - name: MY_CUSTOM_VAR
  #     value: "my-value"
  #   - name: SECRET_VAR
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: secret-key
  extraEnv: []

  # Master encryption key (required)
  # Generate with: openssl rand -base64 32
  # For production, use an existing Kubernetes Secret
  masterKey:
    existingSecret: ""        # Name of existing Kubernetes secret
    secretKey: "master-key"   # Key in the secret where master key is stored
    value: ""                 # Only used if existingSecret is not set (must be 32-byte base64)

  # Optional configuration
  # Log level: trace, debug, info, warn, error, fatal
  # Defaults to info in production, debug in development
  logLevel: ""

  # Additional trusted origins (comma-separated)
  # Useful when behind a proxy or using multiple domains
  # Example: "http://192.168.1.100:3000,https://norish.example.com"
  trustedOrigins: ""

  # Enable/disable password authentication
  # Defaults to false if OIDC or OAuth is configured, true otherwise
  passwordAuthEnabled: ""

  # Allow new users to register themselves (ENABLE_REGISTRATION)
  # Leave empty to use the application default (false).
  # The first account created always becomes the server owner/admin.
  enableRegistration: ""

  # Uploads directory inside the container (UPLOADS_DIR)
  # Also used as the mount path for the uploads volume
  uploadsDir: "/app/uploads"

  # Timeout for recipe parser API calls in milliseconds (PARSER_API_TIMEOUT_MS)
  # Leave empty to use the application default (15000)
  parserApiTimeoutMs: ""

  # Instance default locale, must match a supported locale (DEFAULT_LOCALE)
  defaultLocale: ""

  # Comma-separated list of enabled locales (ENABLED_LOCALES)
  # Leave empty to enable all locales. Example: "en,de,nl"
  enabledLocales: ""

  # Authentication provider configuration
  # Configure ONE provider for initial admin account creation
  # After first login, manage additional providers via Settings → Admin
  auth:
    # OIDC/OAuth2 provider
    oidc:
      enabled: false
      name: "MyAuth"
      issuer: ""
      clientId: ""
      clientSecret: ""
      # Optional: OIDC well-known configuration URL
      # By default derived from issuer by appending /.well-known/openid-configuration
      wellKnown: ""
      # Use existing secret for OIDC credentials
      existingSecret: ""
      clientIdKey: "oidc-client-id"
      clientSecretKey: "oidc-client-secret"

      # Claim mapping: auto-assign the admin role and households from OIDC claims
      # Disabled by default for security
      claimMapping:
        enabled: false
        # Additional scopes to request, comma-separated (e.g. "groups" for Keycloak)
        scopes: ""
        groupsClaim: "groups"                      # Claim containing the user groups
        adminGroup: "norish_admin"                 # Group that grants the server admin role
        householdGroupPrefix: "norish_household_"  # Prefix for household groups

    # GitHub OAuth
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
      # Use existing secret for GitHub credentials
      existingSecret: ""
      clientIdKey: "github-client-id"
      clientSecretKey: "github-client-secret"

    # Google OAuth
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
      # Use existing secret for Google credentials
      existingSecret: ""
      clientIdKey: "google-client-id"
      clientSecretKey: "google-client-secret"

## External PostgreSQL database configuration (REQUIRED)
## Norish requires a central PostgreSQL database
## You must have a PostgreSQL server available before deploying this chart
database:
  # Database connection details
  host: ""                    # Required: PostgreSQL server hostname
  port: 5432
  name: norish
  username: postgres
  password: ""

  # Use existing secret for database credentials (recommended for production)
  existingSecret: ""          # Name of existing Kubernetes secret
  usernameKey: "username"     # Key in the secret for database username
  passwordKey: "password"     # Key in the secret for database password
  databaseKey: "database"     # Key in the secret for database name (optional)
  hostKey: ""             # Key in the secret for database host (optional)

## External Redis configuration (REQUIRED for v0.14.0+)
## Redis is required for job queues and background tasks starting from v0.14.0-beta
redis:
  # Redis connection details
  host: ""                    # Required: Redis server hostname
  port: 6379
  database: 0
  # Authentication (leave empty if Redis has no auth)
  username: ""                # Optional: Redis username (Redis 6.0+)
  password: ""                # Redis password (leave empty if no auth)

  # Use existing secret for Redis credentials (recommended for production)
  # NOTE: When using existingSecret, the secret MUST contain a key with the full Redis URL
  #       Format: redis://[username]:[password]@host:port/database
  existingSecret: ""          # Name of existing Kubernetes secret
  urlKey: "redis-url"         # Key in existingSecret containing the full Redis URL
  passwordKey: "password"     # Key in existingSecret for password (for compatibility)

## Chrome Headless configuration (REQUIRED)
## Required for improved recipe parsing and scraping
chrome:
  enabled: true
  image:
    repository: zenika/alpine-chrome
    tag: "latest"
    pullPolicy: IfNotPresent

  # Chrome port for remote debugging
  port: 9222

  # Chrome security context - requires specific capabilities
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    capabilities:
      add:
        - SYS_ADMIN

  # Chrome resource limits
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
